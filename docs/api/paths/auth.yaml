# 인증 관련 API

/oauth/authorize:
  get:
    tags:
      - Authentication
    summary: OAuth2 인증 시작
    description: OAuth2 Authorization Code flow with PKCE를 시작합니다.
    parameters:
      - name: client_id
        in: query
        required: true
        description: 클라이언트 ID
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        description: 리다이렉트 URI
        schema:
          type: string
      - name: response_type
        in: query
        required: true
        description: 응답 타입
        schema:
          type: string
          enum: [code]
      - name: scope
        in: query
        required: false
        description: 요청할 권한 범위
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: CSRF 방지를 위한 상태값
        schema:
          type: string
      - name: code_challenge
        in: query
        required: true
        description: PKCE 코드 챌린지
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: true
        description: PKCE 코드 챌린지 메서드
        schema:
          type: string
          enum: [S256]
    responses:
      '302':
        description: 인증 페이지로 리다이렉트
      '400':
        $ref: '#/components/responses/BadRequest'

/oauth/token:
  post:
    tags:
      - Authentication
    summary: OAuth2 토큰 발급
    description: Authorization Code를 사용하여 액세스 토큰을 발급받습니다.
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - grant_type
              - client_id
              - code
              - redirect_uri
              - code_verifier
            properties:
              grant_type:
                type: string
                enum: [authorization_code]
                description: 권한 부여 타입
              client_id:
                type: string
                description: 클라이언트 ID
              client_secret:
                type: string
                description: 클라이언트 시크릿
              code:
                type: string
                description: Authorization Code
              redirect_uri:
                type: string
                description: 리다이렉트 URI
              code_verifier:
                type: string
                description: PKCE 코드 검증자
    responses:
      '200':
        description: 토큰 발급 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description: 액세스 토큰
                token_type:
                  type: string
                  example: "Bearer"
                expires_in:
                  type: integer
                  description: 토큰 만료 시간 (초)
                refresh_token:
                  type: string
                  description: 리프레시 토큰
                scope:
                  type: string
                  description: 토큰 권한 범위
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'

/oauth/refresh:
  post:
    tags:
      - Authentication
    summary: 토큰 갱신
    description: 리프레시 토큰을 사용하여 새로운 액세스 토큰을 발급받습니다.
    requestBody:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - grant_type
              - refresh_token
            properties:
              grant_type:
                type: string
                enum: [refresh_token]
                description: 권한 부여 타입
              refresh_token:
                type: string
                description: 리프레시 토큰
              client_id:
                type: string
                description: 클라이언트 ID
              client_secret:
                type: string
                description: 클라이언트 시크릿
    responses:
      '200':
        description: 토큰 갱신 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                  description: 새로운 액세스 토큰
                token_type:
                  type: string
                  example: "Bearer"
                expires_in:
                  type: integer
                  description: 토큰 만료 시간 (초)
                refresh_token:
                  type: string
                  description: 새로운 리프레시 토큰
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'

/logout:
  post:
    tags:
      - Authentication
    summary: 로그아웃
    description: 현재 세션을 종료하고 토큰을 무효화합니다.
    responses:
      '200':
        description: 로그아웃 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "로그아웃되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
