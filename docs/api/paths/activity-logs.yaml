# 활동 로그 관리 API

/workspaces/{workspaceId}/activity-logs:
  get:
    tags:
      - Activity Logs
    summary: 워크스페이스 활동 로그 조회
    description: 워크스페이스의 활동 로그를 조회합니다.
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      - name: type
        in: query
        description: 활동 타입 필터
        schema:
          type: string
          example: "CARD_CREATED"
      - name: actorId
        in: query
        description: 활동 수행자 ID 필터
        schema:
          type: string
          format: uuid
          example: "usr_1234567890abcdef"
    responses:
      '200':
        description: 활동 로그 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityLog'
                pagination:
                  $ref: '#/components/schemas/Pagination'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

