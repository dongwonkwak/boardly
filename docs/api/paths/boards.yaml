# 보드 관리 API

get:
  tags:
    - Boards
  summary: 워크스페이스의 보드 목록 조회
  description: 특정 워크스페이스에 속한 보드 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/workspaceId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/search'
    - $ref: '#/components/parameters/sortBy'
    - $ref: '#/components/parameters/sortOrder'
  responses:
    '200':
      description: 보드 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
              pagination:
                $ref: '#/components/schemas/Pagination'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Boards
  summary: 새로운 보드 생성
  description: 워크스페이스에 새로운 보드를 생성합니다.
  parameters:
    - $ref: '#/components/parameters/workspaceId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: 보드 이름
              example: "프로젝트 A"
            description:
              type: string
              maxLength: 500
              description: 보드 설명 (선택사항)
              example: "프로젝트 A 관리 보드"
            visibility:
              type: string
              enum: [PRIVATE, WORKSPACE, PUBLIC]
              description: 공개 범위 (기본값: PRIVATE)
              example: "PRIVATE"
        example:
          name: "프로젝트 A"
          description: "프로젝트 A 관리 보드"
          visibility: "PRIVATE"
  responses:
    '201':
      description: 보드 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Board'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{boardId}:
  get:
    tags:
      - Boards
    summary: 보드 상세 정보 조회
    description: 특정 보드의 상세 정보를 조회합니다.
    parameters:
      - $ref: '#/components/parameters/boardId'
    responses:
      '200':
        description: 보드 상세 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Board'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  put:
    tags:
      - Boards
    summary: 보드 정보 수정
    description: 보드의 정보를 수정합니다.
    parameters:
      - $ref: '#/components/parameters/boardId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                description: 보드 이름
                example: "프로젝트 A (수정)"
              description:
                type: string
                maxLength: 500
                description: 보드 설명
                example: "프로젝트 A 관리 보드 (수정)"
              isPublic:
                type: boolean
                description: 공개 여부
                example: true
          example:
            title: "프로젝트 A (수정)"
            description: "프로젝트 A 관리 보드 (수정)"
            isPublic: true
    responses:
      '200':
        description: 보드 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Board'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Boards
    summary: 보드 삭제
    description: 보드를 삭제합니다. (관리자만 가능)
    parameters:
      - $ref: '#/components/parameters/boardId'
    responses:
      '200':
        description: 보드 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "보드가 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
