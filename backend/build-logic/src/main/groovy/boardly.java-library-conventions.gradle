plugins {
  id 'java-library'
}

group = 'com.boardly'
version = '0.0.1-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
  }
}

repositories {
  mavenCentral()
}

dependencies {
  compileOnly libs.lombok
  annotationProcessor libs.lombok

  testImplementation libs.spring.boot.starter.test
}

tasks.named('test') {
  useJUnitPlatform()
}
