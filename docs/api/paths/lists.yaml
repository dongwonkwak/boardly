# 리스트 관리 API

get:
  tags:
    - Lists
  summary: 보드의 리스트 목록 조회
  description: 특정 보드에 속한 리스트 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  responses:
    '200':
      description: 리스트 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/List'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Lists
  summary: 새로운 리스트 생성
  description: 보드에 새로운 리스트를 생성합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
              description: 리스트 이름
              example: "검토 중"
        example:
          name: "검토 중"
  responses:
    '201':
      description: 리스트 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/List'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{listId}:
  put:
    tags:
      - Lists
    summary: 리스트 정보 수정
    description: 리스트의 정보를 수정합니다.
    parameters:
      - $ref: '#/components/parameters/listId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 50
                description: 리스트 이름
                example: "검토 중 (수정)"
            example:
              name: "검토 중 (수정)"
    responses:
      '200':
        description: 리스트 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/List'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Lists
    summary: 리스트 삭제
    description: 리스트를 삭제합니다.
    parameters:
      - $ref: '#/components/parameters/listId'
    responses:
      '200':
        description: 리스트 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "리스트가 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
