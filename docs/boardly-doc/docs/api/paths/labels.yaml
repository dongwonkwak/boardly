# 라벨 관리 API

get:
  tags:
    - Labels
  summary: 보드의 라벨 목록 조회
  description: 특정 보드에 속한 라벨 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  responses:
    '200':
      description: 라벨 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Labels
  summary: 새로운 라벨 생성
  description: 보드에 새로운 라벨을 생성합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - color
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 20
              description: 라벨 이름
              example: "긴급"
            color:
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              description: 라벨 색상 (hex)
              example: "#FF0000"
        example:
          name: "긴급"
          color: "#FF0000"
  responses:
    '201':
      description: 라벨 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Label'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{labelId}:
  put:
    tags:
      - Labels
    summary: 라벨 정보 수정
    description: 라벨의 정보를 수정합니다.
    parameters:
      - $ref: '#/components/parameters/labelId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 20
                description: 라벨 이름
                example: "긴급 (수정)"
              color:
                type: string
                pattern: '^#[0-9A-Fa-f]{6}$'
                description: 라벨 색상 (hex)
                example: "#FF0000"
            example:
              name: "긴급 (수정)"
              color: "#FF0000"
    responses:
      '200':
        description: 라벨 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Label'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Labels
    summary: 라벨 삭제
    description: 라벨을 삭제합니다.
    parameters:
      - $ref: '#/components/parameters/labelId'
    responses:
      '200':
        description: 라벨 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "라벨이 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
