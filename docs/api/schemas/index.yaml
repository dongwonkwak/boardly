# 공통 스키마 정의

Error:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      description: 오류 코드
      example: "VALIDATION_ERROR"
    message:
      type: string
      description: 오류 메시지
      example: "입력값이 올바르지 않습니다"
    details:
      type: object
      description: 상세 오류 정보
      additionalProperties: true

Pagination:
  type: object
  properties:
    page:
      type: integer
      minimum: 1
      description: 현재 페이지 번호
      example: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: 페이지당 항목 수
      example: 20
    total:
      type: integer
      description: 전체 항목 수
      example: 150
    totalPages:
      type: integer
      description: 전체 페이지 수
      example: 8

User:
  type: object
  required:
    - id
    - email
    - name
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 사용자 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    email:
      type: string
      format: email
      description: 이메일 주소
      example: "user@example.com"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 사용자 이름
      example: "홍길동"
    profileImage:
      type: string
      format: uri
      description: 프로필 이미지 URL
      example: "https://example.com/profile.jpg"
    createdAt:
      type: string
      format: date-time
      description: 가입일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 정보 수정일시
      example: "2024-01-01T00:00:00Z"

Workspace:
  type: object
  required:
    - id
    - name
    - type
    - isPublic
    - ownerId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 워크스페이스 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 워크스페이스 이름
      example: "개발팀"
    description:
      type: string
      maxLength: 200
      description: 워크스페이스 설명
      example: "개발팀 전용 워크스페이스"
    type:
      type: string
      enum: [PERSONAL, TEAM]
      description: 워크스페이스 타입
      example: "TEAM"
    isPublic:
      type: boolean
      description: 공개 여부
      example: false
    ownerId:
      type: string
      format: uuid
      description: 소유자 사용자 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

WorkspaceMember:
  type: object
  required:
    - workspaceId
    - userId
    - role
    - status
    - createdBy
    - createdAt
    - updatedAt
  properties:
    workspaceId:
      type: string
      format: uuid
      description: 워크스페이스 ID (합성키 일부)
      example: "wks_1234567890abcdef"
    userId:
      type: string
      format: uuid
      description: 사용자 ID (합성키 일부)
      example: "usr_1234567890abcdef"
    role:
      type: string
      enum: [ADMIN, MEMBER]
      description: 멤버 역할
      example: "MEMBER"
    invitedBy:
      type: string
      format: uuid
      description: 초대한 사용자 ID
      example: "usr_1234567890abcdef"
    invitedAt:
      type: string
      format: date-time
      description: 초대일시
      example: "2024-01-01T00:00:00Z"
    joinedAt:
      type: string
      format: date-time
      description: 가입일시
      example: "2024-01-01T00:00:00Z"
    status:
      type: string
      enum: [ACTIVE, INVITED, REMOVED]
      description: 멤버 상태
      example: "ACTIVE"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    user:
      $ref: '#/components/schemas/User'

Board:
  type: object
  required:
    - id
    - name
    - workspaceId
    - visibility
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 보드 고유 식별자
      example: "brd_1234567890abcdef"
    name:
      type: string
      minLength: 1
      maxLength: 100
      description: 보드 이름
      example: "프로젝트 A"
    description:
      type: string
      maxLength: 500
      description: 보드 설명
      example: "프로젝트 A 관리 보드"
    workspaceId:
      type: string
      format: uuid
      description: 소속 워크스페이스 ID
      example: "wks_1234567890abcdef"
    visibility:
      type: string
      enum: [PRIVATE, WORKSPACE, PUBLIC]
      description: 공개 범위
      example: "PRIVATE"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

BoardMember:
  type: object
  required:
    - boardId
    - userId
    - role
    - status
    - isFavorite
    - createdBy
    - createdAt
    - updatedAt
  properties:
    boardId:
      type: string
      format: uuid
      description: 보드 ID (합성키 일부)
      example: "brd_1234567890abcdef"
    userId:
      type: string
      format: uuid
      description: 사용자 ID (합성키 일부)
      example: "usr_1234567890abcdef"
    role:
      type: string
      enum: [ADMIN, MEMBER, VIEWER]
      description: 멤버 역할
      example: "MEMBER"
    status:
      type: string
      enum: [ACTIVE]
      description: 멤버 상태
      example: "ACTIVE"
    addedBy:
      type: string
      format: uuid
      description: 추가한 사용자 ID
      example: "usr_1234567890abcdef"
    addedAt:
      type: string
      format: date-time
      description: 추가일시
      example: "2024-01-01T00:00:00Z"
    isFavorite:
      type: boolean
      description: 즐겨찾기 여부
      example: false
    favoriteAt:
      type: string
      format: date-time
      description: 즐겨찾기 등록일시
      example: "2024-01-01T00:00:00Z"
    lastAccessAt:
      type: string
      format: date-time
      description: 최근 접근일시
      example: "2024-01-01T00:00:00Z"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    user:
      $ref: '#/components/schemas/User'

List:
  type: object
  required:
    - id
    - name
    - boardId
    - position
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 리스트 고유 식별자
      example: "lst_1234567890abcdef"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 리스트 이름
      example: "할 일"
    boardId:
      type: string
      format: uuid
      description: 소속 보드 ID
      example: "brd_1234567890abcdef"
    position:
      type: integer
      description: 리스트 순서
      example: 1
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    archivedAt:
      type: string
      format: date-time
      description: 아카이브일시
      example: "2024-01-01T00:00:00Z"

Card:
  type: object
  required:
    - id
    - title
    - boardId
    - listId
    - position
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 카드 고유 식별자
      example: "crd_1234567890abcdef"
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: 카드 제목
      example: "로그인 기능 구현"
    description:
      type: string
      description: 카드 설명
      example: "사용자 로그인 기능을 구현합니다."
    boardId:
      type: string
      format: uuid
      description: 소속 보드 ID
      example: "brd_1234567890abcdef"
    listId:
      type: string
      format: uuid
      description: 소속 리스트 ID
      example: "lst_1234567890abcdef"
    position:
      type: integer
      description: 카드 순서
      example: 1
    startDate:
      type: string
      format: date-time
      description: 시작일
      example: "2024-01-01T00:00:00Z"
    dueDate:
      type: string
      format: date-time
      description: 마감일
      example: "2024-01-15T00:00:00Z"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    archivedAt:
      type: string
      format: date-time
      description: 아카이브일시
      example: "2024-01-01T00:00:00Z"

CardMember:
  type: object
  required:
    - cardId
    - userId
    - createdBy
    - createdAt
    - updatedAt
  properties:
    cardId:
      type: string
      format: uuid
      description: 카드 ID (합성키 일부)
      example: "crd_1234567890abcdef"
    userId:
      type: string
      format: uuid
      description: 사용자 ID (합성키 일부)
      example: "usr_1234567890abcdef"
    addedBy:
      type: string
      format: uuid
      description: 할당한 사용자 ID
      example: "usr_1234567890abcdef"
    addedAt:
      type: string
      format: date-time
      description: 할당일시
      example: "2024-01-01T00:00:00Z"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    user:
      $ref: '#/components/schemas/User'

Comment:
  type: object
  required:
    - id
    - body
    - cardId
    - authorId
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 댓글 고유 식별자
      example: "cmt_1234567890abcdef"
    body:
      type: string
      minLength: 1
      maxLength: 1000
      description: 댓글 내용
      example: "이 작업은 다음 주까지 완료하겠습니다."
    cardId:
      type: string
      format: uuid
      description: 소속 카드 ID
      example: "crd_1234567890abcdef"
    authorId:
      type: string
      format: uuid
      description: 작성자 ID
      example: "usr_1234567890abcdef"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 작성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    deletedAt:
      type: string
      format: date-time
      description: 삭제일시
      example: "2024-01-01T00:00:00Z"
    author:
      $ref: '#/components/schemas/User'

Label:
  type: object
  required:
    - id
    - name
    - boardId
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 라벨 고유 식별자
      example: "lbl_1234567890abcdef"
    name:
      type: string
      minLength: 1
      maxLength: 20
      description: 라벨 이름
      example: "긴급"
    color:
      type: string
      description: 라벨 색상
      example: "#ff0000"
    boardId:
      type: string
      format: uuid
      description: 소속 보드 ID
      example: "brd_1234567890abcdef"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

CardLabel:
  type: object
  required:
    - cardId
    - labelId
    - createdBy
    - createdAt
    - updatedAt
  properties:
    cardId:
      type: string
      format: uuid
      description: 카드 ID (합성키 일부)
      example: "crd_1234567890abcdef"
    labelId:
      type: string
      format: uuid
      description: 라벨 ID (합성키 일부)
      example: "lbl_1234567890abcdef"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

Attachment:
  type: object
  required:
    - id
    - cardId
    - filename
    - storageUrl
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 첨부파일 고유 식별자
      example: "att_1234567890abcdef"
    cardId:
      type: string
      format: uuid
      description: 소속 카드 ID
      example: "crd_1234567890abcdef"
    filename:
      type: string
      description: 파일명
      example: "document.pdf"
    mimeType:
      type: string
      description: MIME 타입
      example: "application/pdf"
    sizeBytes:
      type: integer
      description: 파일 크기 (바이트)
      example: 1024000
    storageUrl:
      type: string
      description: 저장소 URL
      example: "https://storage.example.com/files/document.pdf"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

ActivityLog:
  type: object
  required:
    - id
    - actorId
    - type
    - createdBy
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 활동 로그 고유 식별자
      example: "act_1234567890abcdef"
    actorId:
      type: string
      format: uuid
      description: 활동 수행자 ID
      example: "usr_1234567890abcdef"
    workspaceId:
      type: string
      format: uuid
      description: 관련 워크스페이스 ID
      example: "wks_1234567890abcdef"
    boardId:
      type: string
      format: uuid
      description: 관련 보드 ID
      example: "brd_1234567890abcdef"
    cardId:
      type: string
      format: uuid
      description: 관련 카드 ID
      example: "crd_1234567890abcdef"
    type:
      type: string
      description: 활동 타입
      example: "CARD_CREATED"
    payload:
      type: string
      description: 활동 상세 정보 (JSON)
      example: '{"cardTitle": "새 카드", "listName": "할 일"}'
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"

Invite:
  type: object
  required:
    - id
    - scope
    - email
    - role
    - token
    - inviteUrl
    - expiresAt
    - invitedBy
    - status
    - createdBy
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: 초대 고유 식별자
      example: "inv_1234567890abcdef"
    scope:
      type: string
      enum: [WORKSPACE, BOARD]
      description: 초대 범위
      example: "WORKSPACE"
    workspaceId:
      type: string
      format: uuid
      description: 초대할 워크스페이스 ID
      example: "wks_1234567890abcdef"
    boardId:
      type: string
      format: uuid
      description: 초대할 보드 ID
      example: "brd_1234567890abcdef"
    email:
      type: string
      format: email
      description: 초대받을 사용자 이메일
      example: "user@example.com"
    role:
      type: string
      enum: [ADMIN, MEMBER, VIEWER]
      description: 초대할 역할
      example: "MEMBER"
    token:
      type: string
      description: 초대 토큰 (고유값)
      example: "abc123def456"
    inviteUrl:
      type: string
      description: 초대 URL
      example: "https://boardly.com/invite/abc123def456"
    expiresAt:
      type: string
      format: date-time
      description: 초대 만료일시
      example: "2024-01-08T00:00:00Z"
    invitedBy:
      type: string
      format: uuid
      description: 초대한 사용자 ID
      example: "usr_1234567890abcdef"
    acceptedBy:
      type: string
      format: uuid
      description: 수락한 사용자 ID
      example: "usr_1234567890abcdef"
    acceptedAt:
      type: string
      format: date-time
      description: 수락일시
      example: "2024-01-01T00:00:00Z"
    status:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
      description: 초대 상태
      example: "PENDING"
    createdBy:
      type: string
      format: uuid
      description: 생성자 사용자 ID
      example: "usr_1234567890abcdef"
    createdAt:
      type: string
      format: date-time
      description: 초대 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
