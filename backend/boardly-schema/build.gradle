buildscript {
  repositories { mavenCentral() }
  dependencies {
    // Flyway Gradle plugin v11 requires database-specific plugin + JDBC driver on the buildscript classpath
    classpath libs.flyway.postgres
    classpath libs.postgres
  }
}

plugins {
  id 'java-library'
  alias(libs.plugins.flyway)
}

group = 'com.boardly'
version = '0.0.1-SNAPSHOT'

java {
  toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
}

repositories { mavenCentral() }

dependencies {
  // DB drivers for plugin to connect
  runtimeOnly libs.h2
  runtimeOnly libs.postgres
}

def migrationsRoot = file("${projectDir}/src/main/resources/db/migration")

// -------------------------------
// Schema validation tasks (Flyway Gradle Plugin)
// -------------------------------

// Use file-based H2 so tasks (clean -> migrate -> validate) share the same DB state
def h2FilePath = "${project.buildDir}/h2/boardly_schema_validate"
def h2Url = "jdbc:h2:file:${h2FilePath};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE"

// Ensure old H2 files are removed to avoid file locks
tasks.register('schemaH2ResetFiles', Delete) {
  group = 'schema'
  description = 'Delete file-based H2 database files for a clean start'
  delete layout.buildDirectory.dir('h2')
}

tasks.register('schemaH2Clean', org.flywaydb.gradle.task.FlywayCleanTask) {
  group = 'schema'
  description = 'Clean file-based H2 validation database'
  url = h2Url
  user = 'sa'
  password = ''
  cleanDisabled = false
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/h2",
  ]
}

tasks.register('schemaH2Migrate', org.flywaydb.gradle.task.FlywayMigrateTask) {
  group = 'schema'
  description = 'Run migrations against in-memory H2 (PostgreSQL mode)'
  url = h2Url
  user = 'sa'
  password = ''
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/h2",
  ]
}

tasks.register('schemaH2Validate', org.flywaydb.gradle.task.FlywayValidateTask) {
  group = 'schema'
  description = 'Validate migrations for H2 profile'
  url = h2Url
  user = 'sa'
  password = ''
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/h2",
  ]
}

tasks.register('schemaValidateH2') {
  group = 'schema'
  description = 'Clean + migrate + validate against in-memory H2'
  dependsOn 'schemaH2ResetFiles', 'schemaH2Validate'
}

// Enforce execution order: reset -> clean -> migrate -> validate
tasks.named('schemaH2Clean').configure { dependsOn 'schemaH2ResetFiles' }
tasks.named('schemaH2Migrate').configure { dependsOn 'schemaH2Clean' }
tasks.named('schemaH2Validate').configure { dependsOn 'schemaH2Migrate' }

def pgUrl = providers.gradleProperty('pgUrl').orElse('jdbc:postgresql://localhost:5432/boardly').get()
def pgUser = providers.gradleProperty('pgUser').orElse('boardly').get()
def pgPassword = providers.gradleProperty('pgPassword').orElse('password').get()
def pgSchema = providers.gradleProperty('pgSchema').orElse('schema_validation').get()

// PostgreSQL 검증 설정값 출력
logger.lifecycle("=== PostgreSQL Validation Configuration ===")
logger.lifecycle("pgUrl: ${pgUrl}")
logger.lifecycle("pgUser: ${pgUser}")
logger.lifecycle("pgPassword: ${pgPassword.replaceAll('.', '*')}") // 비밀번호는 마스킹
logger.lifecycle("pgSchema: ${pgSchema}")
logger.lifecycle("==========================================")

tasks.register('schemaPgClean', org.flywaydb.gradle.task.FlywayCleanTask) {
  group = 'schema'
  description = 'Clean PostgreSQL validation schema'
  url = pgUrl
  user = pgUser
  password = pgPassword
  defaultSchema = pgSchema
  schemas = [pgSchema]
  createSchemas = true
  cleanDisabled = false
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/postgresql",
  ]
  
  doFirst {
    logger.lifecycle("Starting PostgreSQL Clean Task...")
  }
}

tasks.register('schemaPgMigrate', org.flywaydb.gradle.task.FlywayMigrateTask) {
  group = 'schema'
  description = 'Run migrations against PostgreSQL validation schema'
  url = pgUrl
  user = pgUser
  password = pgPassword
  defaultSchema = pgSchema
  schemas = [pgSchema]
  createSchemas = true
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/postgresql",
  ]
  
  doFirst {
    logger.lifecycle("Starting PostgreSQL Migrate Task...")
  }
}

tasks.register('schemaPgValidate', org.flywaydb.gradle.task.FlywayValidateTask) {
  group = 'schema'
  description = 'Validate migrations for PostgreSQL profile'
  url = pgUrl
  user = pgUser
  password = pgPassword
  defaultSchema = pgSchema
  schemas = [pgSchema]
  locations = [
    "filesystem:${migrationsRoot}/common",
    "filesystem:${migrationsRoot}/postgresql",
  ]
  
  doFirst {
    logger.lifecycle("Starting PostgreSQL Validate Task...")
  }
}

tasks.register('schemaValidatePostgresql') {
  group = 'schema'
  description = 'Clean + migrate + validate against PostgreSQL (requires running DB)'
  dependsOn 'schemaPgClean', 'schemaPgMigrate', 'schemaPgValidate'
}

// -------------------------------
// Schema documentation generation
// -------------------------------
def sortSqlFiles = { File dir ->
  def files = [] as List<File>
  if (dir.exists()) {
    files.addAll(dir.listFiles({ f -> f.name.toLowerCase().endsWith('.sql') } as FileFilter))
    files.sort { a, b -> a.name <=> b.name }
  }
  return files
}

tasks.register('generateSchemaDocs') {
  group = 'schema'
  description = 'Generate simple schema documentation from migration scripts'
  outputs.dir layout.buildDirectory.dir('schema-docs')
  doLast {
    def outDir = layout.buildDirectory.dir('schema-docs').get().asFile
    outDir.mkdirs()

    def commonDir = new File(migrationsRoot, 'common')
    def h2Dir = new File(migrationsRoot, 'h2')
    def pgDir = new File(migrationsRoot, 'postgresql')

    def md = new StringBuilder()
    md << '# Boardly Schema Migrations\n\n'
    md << 'This document is auto-generated from migration scripts.\n\n'

    [
      'common': commonDir,
      'h2': h2Dir,
      'postgresql': pgDir,
    ].each { name, dir ->
      md << "## ${name}\n\n"
      def files = sortSqlFiles(dir)
      if (files.isEmpty()) {
        md << '- (no scripts)\n\n'
      } else {
        files.each { f -> md << "- ${f.name}\n" }
        md << '\n'
      }
    }

    file(new File(outDir, 'migrations.md')).text = md.toString()

    // Concatenate SQL per dialect for quick overview (V* first, then R__*)
    [ h2: h2Dir, postgresql: pgDir ].each { name, dir ->
      def dialectDir = new File(outDir, name as String)
      dialectDir.mkdirs()
      def versioned = sortSqlFiles(dir).findAll { it.name.startsWith('V') }
      def repeatable = sortSqlFiles(dir).findAll { it.name.startsWith('R__') }
      def outFile = new File(dialectDir, 'all.sql')
      outFile.withWriter('UTF-8') { w ->
        versioned.each { f -> w << "-- >>> ${f.name} >>>\n"; w << f.getText('UTF-8'); w << "\n\n" }
        repeatable.each { f -> w << "-- >>> ${f.name} >>>\n"; w << f.getText('UTF-8'); w << "\n\n" }
      }
    }
    logger.lifecycle("Schema docs generated at ${outDir}")
  }
}
