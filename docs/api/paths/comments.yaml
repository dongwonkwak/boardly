# 댓글 관리 API

get:
  tags:
    - Comments
  summary: 카드의 댓글 목록 조회
  description: 특정 카드에 속한 댓글 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/cardId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/limit'
  responses:
    '200':
      description: 댓글 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
              pagination:
                $ref: '#/components/schemas/Pagination'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Comments
  summary: 새로운 댓글 작성
  description: 카드에 새로운 댓글을 작성합니다.
  parameters:
    - $ref: '#/components/parameters/cardId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - content
          properties:
            content:
              type: string
              minLength: 1
              maxLength: 1000
              description: 댓글 내용
              example: "이 작업은 다음 주까지 완료하겠습니다"
        example:
          content: "이 작업은 다음 주까지 완료하겠습니다"
  responses:
    '201':
      description: 댓글 작성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Comment'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{commentId}:
  put:
    tags:
      - Comments
    summary: 댓글 수정
    description: 댓글을 수정합니다. (작성자만 가능)
    parameters:
      - $ref: '#/components/parameters/commentId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - content
            properties:
              content:
                type: string
                minLength: 1
                maxLength: 1000
                description: 댓글 내용
                example: "이 작업은 다음 주까지 완료하겠습니다 (수정)"
            example:
              content: "이 작업은 다음 주까지 완료하겠습니다 (수정)"
    responses:
      '200':
        description: 댓글 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Comment'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Comments
    summary: 댓글 삭제
    description: 댓글을 삭제합니다. (작성자만 가능)
    parameters:
      - $ref: '#/components/parameters/commentId'
    responses:
      '200':
        description: 댓글 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "댓글이 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
