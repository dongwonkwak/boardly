# 카드 관리 API

get:
  tags:
    - Cards
  summary: 보드의 카드 목록 조회
  description: 특정 보드에 속한 카드 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/limit'
  responses:
    '200':
      description: 카드 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              pagination:
                $ref: '#/components/schemas/Pagination'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Cards
  summary: 새로운 카드 생성
  description: 리스트에 새로운 카드를 생성합니다.
  parameters:
    - $ref: '#/components/parameters/listId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - title
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 200
              description: 카드 제목
              example: "로그인 기능 구현"
            description:
              type: string
              description: 카드 설명
              example: "사용자 로그인 기능을 구현합니다."
            startDate:
              type: string
              format: date-time
              description: 시작일
              example: "2024-01-01T00:00:00Z"
            dueDate:
              type: string
              format: date-time
              description: 마감일
              example: "2024-01-15T00:00:00Z"
        example:
          title: "로그인 기능 구현"
          description: "사용자 로그인 기능을 구현합니다."
          startDate: "2024-01-01T00:00:00Z"
          dueDate: "2024-01-15T00:00:00Z"
  responses:
    '201':
      description: 카드 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Card'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{cardId}:
  get:
    tags:
      - Cards
    summary: 카드 상세 정보 조회
    description: 특정 카드의 상세 정보를 조회합니다.
    parameters:
      - $ref: '#/components/parameters/cardId'
    responses:
      '200':
        description: 카드 상세 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Card'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  put:
    tags:
      - Cards
    summary: 카드 정보 수정
    description: 카드의 정보를 수정합니다.
    parameters:
      - $ref: '#/components/parameters/cardId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 1
                maxLength: 200
                description: 카드 제목
                example: "로그인 기능 구현 (수정)"
              description:
                type: string
                description: 카드 설명
                example: "사용자 로그인 기능을 구현합니다 (수정)"
              startDate:
                type: string
                format: date-time
                description: 시작일
                example: "2024-01-01T00:00:00Z"
              dueDate:
                type: string
                format: date-time
                description: 마감일
                example: "2024-12-31T23:59:59Z"
          example:
            title: "로그인 기능 구현 (수정)"
            description: "사용자 로그인 기능을 구현합니다 (수정)"
            dueDate: "2024-12-31T23:59:59Z"
    responses:
      '200':
        description: 카드 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Card'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Cards
    summary: 카드 삭제
    description: 카드를 삭제합니다.
    parameters:
      - $ref: '#/components/parameters/cardId'
    responses:
      '200':
        description: 카드 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "카드가 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
