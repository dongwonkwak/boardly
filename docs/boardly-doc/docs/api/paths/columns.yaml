# 컬럼 관리 API

get:
  tags:
    - Columns
  summary: 보드의 컬럼 목록 조회
  description: 특정 보드에 속한 컬럼 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  responses:
    '200':
      description: 컬럼 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Column'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Columns
  summary: 새로운 컬럼 생성
  description: 보드에 새로운 컬럼을 생성합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
              description: 컬럼 이름
              example: "검토 중"
        example:
          name: "검토 중"
  responses:
    '201':
      description: 컬럼 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Column'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'

/{columnId}:
  put:
    tags:
      - Columns
    summary: 컬럼 정보 수정
    description: 컬럼의 정보를 수정합니다.
    parameters:
      - $ref: '#/components/parameters/columnId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 50
                description: 컬럼 이름
                example: "검토 중 (수정)"
            example:
              name: "검토 중 (수정)"
    responses:
      '200':
        description: 컬럼 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Column'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Columns
    summary: 컬럼 삭제
    description: 컬럼을 삭제합니다.
    parameters:
      - $ref: '#/components/parameters/columnId'
    responses:
      '200':
        description: 컬럼 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "컬럼이 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
