# 공통 응답 정의

BadRequest:
  description: 잘못된 요청
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "VALIDATION_ERROR"
        message: "입력값이 올바르지 않습니다"
        details:
          field: "title"
          reason: "제목은 1-100자 사이여야 합니다"

Unauthorized:
  description: 인증되지 않은 요청
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "UNAUTHORIZED"
        message: "인증이 필요합니다"

Forbidden:
  description: 권한이 없는 요청
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "FORBIDDEN"
        message: "이 작업을 수행할 권한이 없습니다"

NotFound:
  description: 리소스를 찾을 수 없음
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "NOT_FOUND"
        message: "요청한 리소스를 찾을 수 없습니다"

Conflict:
  description: 리소스 충돌
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "CONFLICT"
        message: "이미 존재하는 리소스입니다"

InternalServerError:
  description: 서버 내부 오류
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/Error'
      example:
        code: "INTERNAL_SERVER_ERROR"
        message: "서버 내부 오류가 발생했습니다"

Created:
  description: 리소스 생성 성공
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          data:
            type: object
            description: 생성된 리소스 데이터

Updated:
  description: 리소스 수정 성공
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          data:
            type: object
            description: 수정된 리소스 데이터

Deleted:
  description: 리소스 삭제 성공
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: true
          message:
            type: string
            example: "리소스가 성공적으로 삭제되었습니다"
