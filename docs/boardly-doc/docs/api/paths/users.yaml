# 사용자 관리 API

/me:
  get:
    tags:
      - Users
    summary: 현재 사용자 정보 조회
    description: 현재 로그인한 사용자의 정보를 조회합니다.
    responses:
      '200':
        description: 사용자 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/User'
      '401':
        $ref: '#/components/responses/Unauthorized'

  put:
    tags:
      - Users
    summary: 사용자 정보 수정
    description: 현재 사용자의 정보를 수정합니다.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 50
                description: 사용자 이름
                example: "홍길동"
              profileImage:
                type: string
                format: uri
                description: 프로필 이미지 URL
                example: "https://example.com/profile.jpg"
          example:
            name: "홍길동"
            profileImage: "https://example.com/profile.jpg"
    responses:
      '200':
        description: 사용자 정보 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/User'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
