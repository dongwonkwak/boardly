# 초대 관리 API

get:
  tags:
    - Invitations
  summary: 보드의 초대 목록 조회
  description: 특정 보드에 대한 초대 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/limit'
  responses:
    '200':
      description: 초대 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
              pagination:
                $ref: '#/components/schemas/Pagination'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '404':
      $ref: '#/components/responses/NotFound'

post:
  tags:
    - Invitations
  summary: 새로운 초대 생성
  description: 보드에 새로운 사용자를 초대합니다.
  parameters:
    - $ref: '#/components/parameters/boardId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - role
          properties:
            email:
              type: string
              format: email
              description: 초대할 사용자의 이메일
              example: "guest@example.com"
            role:
              type: string
              enum:
                - MEMBER
                - VIEWER
              description: 초대할 역할
              example: "MEMBER"
            expiresIn:
              type: integer
              description: 초대 만료 시간 (일, 기본값: 7)
              example: 7
          example:
            email: "guest@example.com"
            role: "MEMBER"
            expiresIn: 7
  responses:
    '201':
      description: 초대 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Invitation'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '403':
      $ref: '#/components/responses/Forbidden'
    '409':
      $ref: '#/components/responses/Conflict'

/{invitationId}:
  get:
    tags:
      - Invitations
    summary: 초대 상세 정보 조회
    description: 특정 초대의 상세 정보를 조회합니다.
    parameters:
      - $ref: '#/components/parameters/invitationId'
    responses:
      '200':
        description: 초대 상세 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Invitation'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Invitations
    summary: 초대 취소
    description: 초대를 취소합니다.
    parameters:
      - $ref: '#/components/parameters/invitationId'
    responses:
      '200':
        description: 초대 취소 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "초대가 성공적으로 취소되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

/accept/{invitationId}:
  post:
    tags:
      - Invitations
    summary: 초대 수락
    description: 초대를 수락하고 보드에 참여합니다.
    parameters:
      - $ref: '#/components/parameters/invitationId'
    responses:
      '200':
        description: 초대 수락 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "초대를 수락하여 보드에 참여했습니다"
                data:
                  $ref: '#/components/schemas/Board'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '410':
        description: 초대가 만료되었습니다
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
            example:
              code: "INVITATION_EXPIRED"
              message: "초대가 만료되었습니다"
