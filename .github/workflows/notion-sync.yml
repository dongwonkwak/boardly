name: Notion 문서 동기화

# docs/ 폴더의 마크다운 파일이 변경되었을 때만 실행
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**/*.md'
  
  # 수동 실행도 가능
  workflow_dispatch:
    inputs:
      force_sync:
        description: '모든 파일 강제 동기화'
        required: false
        default: false
        type: boolean

env:
  NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
  NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          # 이전 커밋과 비교하기 위해 fetch-depth를 2로 설정
          fetch-depth: 2

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 의존성 설치
        run: |
          npm install @notionhq/client@^2.2.15

      - name: 변경된 파일 확인
        id: changed-files
        run: |
          if [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            echo "force_sync=true" >> $GITHUB_OUTPUT
            echo "🔄 강제 동기화 모드입니다."
          else
            # 이전 커밋과 비교하여 변경된 docs 폴더의 마크다운 파일 찾기
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^docs/.*\.md$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "변경된 파일들:"
              echo "$CHANGED_FILES"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              # 파일 목록을 한 줄로 만들어서 출력에 저장
              echo "files<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "변경된 마크다운 파일이 없습니다."
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Notion 동기화 실행
        if: steps.changed-files.outputs.has_changes == 'true' || steps.changed-files.outputs.force_sync == 'true'
        run: |
          node .github/scripts/notion-sync.js
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          FORCE_SYNC: ${{ steps.changed-files.outputs.force_sync }}

      - name: 동기화 결과 요약
        if: steps.changed-files.outputs.has_changes == 'true' || steps.changed-files.outputs.force_sync == 'true'
        run: |
          echo "✅ Notion 동기화가 완료되었습니다!"
          echo "📊 커밋: ${{ github.sha }}"
          echo "🌿 브랜치: ${{ github.ref_name }}"
