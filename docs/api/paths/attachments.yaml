# 첨부파일 관리 API

/boards/{boardId}/cards/{cardId}/attachments:
  get:
    tags:
      - Attachments
    summary: 카드 첨부파일 목록 조회
    description: 특정 카드에 첨부된 파일 목록을 조회합니다.
    parameters:
      - $ref: '#/components/parameters/boardId'
      - $ref: '#/components/parameters/cardId'
    responses:
      '200':
        description: 첨부파일 목록 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attachment'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  post:
    tags:
      - Attachments
    summary: 카드에 첨부파일 업로드
    description: 카드에 새로운 파일을 첨부합니다.
    parameters:
      - $ref: '#/components/parameters/boardId'
      - $ref: '#/components/parameters/cardId'
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: 업로드할 파일
    responses:
      '201':
        description: 첨부파일 업로드 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Attachment'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '413':
        description: 파일 크기 초과
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: "파일 크기가 제한을 초과했습니다"

/attachments/{attachmentId}:
  get:
    tags:
      - Attachments
    summary: 첨부파일 다운로드
    description: 첨부파일을 다운로드합니다.
    parameters:
      - $ref: '#/components/parameters/attachmentId'
    responses:
      '200':
        description: 첨부파일 다운로드 성공
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Attachments
    summary: 첨부파일 삭제
    description: 첨부파일을 삭제합니다.
    parameters:
      - $ref: '#/components/parameters/attachmentId'
    responses:
      '200':
        description: 첨부파일 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "첨부파일이 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
