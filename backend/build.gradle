plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.version.catalog.update)
}

group = 'com.boardly'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

repositories { mavenCentral() }

tasks.named('test') {
    useJUnitPlatform()
}

// Root project is not an executable Boot app; disable bootJar
tasks.named('bootJar') { enabled = false }
tasks.named('jar') { enabled = true }

// Root project has no Boot main class; disable bootRun
tasks.matching { it.name == 'bootRun' || it.name == 'forkedSpringBootRun' || it.name == 'bootRunMainClassName' }.configureEach {
    enabled = false
}

// JaCoCo aggregate coverage across subprojects
jacoco { toolVersion = libs.versions.jacoco.get() }

subprojects { p ->
    plugins.withId('jacoco') {
        p.tasks.matching { it.name == 'test' }.configureEach { finalizedBy p.tasks.named('jacocoTestReport') }
        p.tasks.matching { it.name == 'jacocoTestReport' }.configureEach { it.enabled = true }
    }
}

tasks.register('jacocoRootReport', JacocoReport) {
    group = 'verification'
    description = 'Generates aggregate JaCoCo coverage report for all modules'
    dependsOn subprojects.collect { it.tasks.matching { t -> t.name == 'test' } }

    def execDataFiles = files(subprojects.collect { it.layout.buildDirectory.file('jacoco/test.exec') })
    executionData.setFrom(execDataFiles)

    def sourceDirs = files(subprojects.collect { it.file('src/main/java') })
    def classDirs = files(subprojects.collect { it.layout.buildDirectory.dir('classes/java/main') })

    sourceDirectories.setFrom(sourceDirs)
    classDirectories.setFrom(classDirs)

    reports {
        html.required = true
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacocoRoot/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacocoRoot/jacocoRootReport.xml')
    }
}


