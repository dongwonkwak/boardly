# 워크스페이스 관리 API

get:
  tags:
    - Workspaces
  summary: 사용자의 워크스페이스 목록 조회
  description: 현재 사용자가 속한 워크스페이스 목록을 조회합니다.
  parameters:
    - $ref: '#/components/parameters/page'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/search'
    - $ref: '#/components/parameters/sortBy'
    - $ref: '#/components/parameters/sortOrder'
  responses:
    '200':
      description: 워크스페이스 목록 조회 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
              pagination:
                $ref: '#/components/schemas/Pagination'
    '401':
      $ref: '#/components/responses/Unauthorized'

post:
  tags:
    - Workspaces
  summary: 새로운 워크스페이스 생성
  description: 새로운 워크스페이스를 생성합니다.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
              description: 워크스페이스 이름
              example: "개발팀"
            description:
              type: string
              maxLength: 200
              description: 워크스페이스 설명 (선택사항)
              example: "개발팀 전용 워크스페이스"
            type:
              type: string
              enum:
                - PERSONAL
                - TEAM
              description: 워크스페이스 타입 (기본값: TEAM)
              example: "TEAM"
            isPublic:
              type: boolean
              description: 공개 여부 (기본값: false)
              example: false
        example:
          name: "개발팀"
          description: "개발팀 전용 워크스페이스"
          type: "TEAM"
          isPublic: false
  responses:
    '201':
      description: 워크스페이스 생성 성공
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                $ref: '#/components/schemas/Workspace'
    '400':
      $ref: '#/components/responses/BadRequest'
    '401':
      $ref: '#/components/responses/Unauthorized'
    '409':
      $ref: '#/components/responses/Conflict'

/{workspaceId}:
  get:
    tags:
      - Workspaces
    summary: 워크스페이스 상세 정보 조회
    description: 특정 워크스페이스의 상세 정보를 조회합니다.
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    responses:
      '200':
        description: 워크스페이스 상세 정보 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Workspace'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  put:
    tags:
      - Workspaces
    summary: 워크스페이스 정보 수정
    description: 워크스페이스의 정보를 수정합니다. (관리자만 가능)
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 50
                description: 워크스페이스 이름
                example: "개발팀 (수정)"
              description:
                type: string
                maxLength: 200
                description: 워크스페이스 설명
                example: "개발팀 전용 워크스페이스 (수정)"
              isPublic:
                type: boolean
                description: 공개 여부
                example: true
          example:
            name: "개발팀 (수정)"
            description: "개발팀 전용 워크스페이스 (수정)"
            isPublic: true
    responses:
      '200':
        description: 워크스페이스 수정 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Workspace'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  delete:
    tags:
      - Workspaces
    summary: 워크스페이스 삭제
    description: 워크스페이스를 삭제합니다. (소유자만 가능)
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    responses:
      '200':
        description: 워크스페이스 삭제 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: "워크스페이스가 성공적으로 삭제되었습니다"
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

/{workspaceId}/members:
  get:
    tags:
      - Workspaces
    summary: 워크스페이스 멤버 목록 조회
    description: 워크스페이스에 속한 멤버 목록을 조회합니다.
    parameters:
      - $ref: '#/components/parameters/workspaceId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
    responses:
      '200':
        description: 멤버 목록 조회 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkspaceMember'
                pagination:
                  $ref: '#/components/schemas/Pagination'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'

  post:
    tags:
      - Workspaces
    summary: 워크스페이스 멤버 초대
    description: 워크스페이스에 새로운 멤버를 초대합니다. (관리자만 가능)
    parameters:
      - $ref: '#/components/parameters/workspaceId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - role
            properties:
              email:
                type: string
                format: email
                description: 초대할 사용자의 이메일
                example: "newmember@example.com"
              role:
                type: string
                enum:
                  - ADMIN
                  - MEMBER
                description: 초대할 역할
                example: "MEMBER"
          example:
            email: "newmember@example.com"
            role: "MEMBER"
    responses:
      '201':
        description: 멤버 초대 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/WorkspaceMember'
      '400':
        $ref: '#/components/responses/BadRequest'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/Conflict'
