# 공통 스키마 정의

Error:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      description: 오류 코드
      example: "VALIDATION_ERROR"
    message:
      type: string
      description: 오류 메시지
      example: "입력값이 올바르지 않습니다"
    details:
      type: object
      description: 상세 오류 정보
      additionalProperties: true

Pagination:
  type: object
  properties:
    page:
      type: integer
      minimum: 1
      description: 현재 페이지 번호
      example: 1
    limit:
      type: integer
      minimum: 1
      maximum: 100
      description: 페이지당 항목 수
      example: 20
    total:
      type: integer
      description: 전체 항목 수
      example: 150
    totalPages:
      type: integer
      description: 전체 페이지 수
      example: 8

User:
  type: object
  required:
    - id
    - email
    - name
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 사용자 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    email:
      type: string
      format: email
      description: 이메일 주소
      example: "user@example.com"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 사용자 이름
      example: "홍길동"
    profileImage:
      type: string
      format: uri
      description: 프로필 이미지 URL
      example: "https://example.com/profile.jpg"
    createdAt:
      type: string
      format: date-time
      description: 가입일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 정보 수정일시
      example: "2024-01-01T00:00:00Z"

Workspace:
  type: object
  required:
    - id
    - name
    - type
    - isPublic
    - ownerId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 워크스페이스 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 워크스페이스 이름
      example: "개발팀"
    description:
      type: string
      maxLength: 200
      description: 워크스페이스 설명
      example: "개발팀 전용 워크스페이스"
    type:
      type: string
      enum: [PERSONAL, TEAM]
      description: 워크스페이스 타입
      example: "TEAM"
    isPublic:
      type: boolean
      description: 공개 여부
      example: false
    ownerId:
      type: string
      format: uuid
      description: 소유자 사용자 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

WorkspaceMembership:
  type: object
  required:
    - id
    - userId
    - workspaceId
    - role
    - joinedAt
  properties:
    id:
      type: string
      format: uuid
      description: 멤버십 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    userId:
      type: string
      format: uuid
      description: 사용자 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    workspaceId:
      type: string
      format: uuid
      description: 워크스페이스 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    role:
      type: string
      enum: [ADMIN, MEMBER]
      description: 멤버 역할
      example: "MEMBER"
    joinedAt:
      type: string
      format: date-time
      description: 가입일시
      example: "2024-01-01T00:00:00Z"
    user:
      $ref: '#/components/schemas/User'

Board:
  type: object
  required:
    - id
    - title
    - workspaceId
    - isPublic
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 보드 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    title:
      type: string
      minLength: 1
      maxLength: 100
      description: 보드 제목
      example: "프로젝트 A"
    description:
      type: string
      maxLength: 500
      description: 보드 설명
      example: "프로젝트 A 관리 보드"
    workspaceId:
      type: string
      format: uuid
      description: 소속 워크스페이스 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    isPublic:
      type: boolean
      description: 공개 여부
      example: false
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

Column:
  type: object
  required:
    - id
    - name
    - boardId
    - order
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 컬럼 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    name:
      type: string
      minLength: 1
      maxLength: 50
      description: 컬럼 이름
      example: "할 일"
    boardId:
      type: string
      format: uuid
      description: 소속 보드 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    order:
      type: integer
      minimum: 0
      description: 컬럼 순서
      example: 0
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"

Card:
  type: object
  required:
    - id
    - title
    - columnId
    - order
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 카드 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    title:
      type: string
      minLength: 1
      maxLength: 200
      description: 카드 제목
      example: "로그인 기능 구현"
    description:
      type: string
      description: 카드 설명
      example: "사용자 로그인 기능을 구현합니다"
    columnId:
      type: string
      format: uuid
      description: 소속 컬럼 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    order:
      type: integer
      minimum: 0
      description: 카드 순서
      example: 0
    dueDate:
      type: string
      format: date-time
      description: 마감일
      example: "2024-12-31T23:59:59Z"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"

Comment:
  type: object
  required:
    - id
    - content
    - cardId
    - userId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 댓글 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    content:
      type: string
      minLength: 1
      maxLength: 1000
      description: 댓글 내용
      example: "이 작업은 다음 주까지 완료하겠습니다"
    cardId:
      type: string
      format: uuid
      description: 소속 카드 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    userId:
      type: string
      format: uuid
      description: 작성자 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    createdAt:
      type: string
      format: date-time
      description: 작성일시
      example: "2024-01-01T00:00:00Z"
    updatedAt:
      type: string
      format: date-time
      description: 수정일시
      example: "2024-01-01T00:00:00Z"
    user:
      $ref: '#/components/schemas/User'

Label:
  type: object
  required:
    - id
    - name
    - color
    - boardId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 라벨 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    name:
      type: string
      minLength: 1
      maxLength: 20
      description: 라벨 이름
      example: "긴급"
    color:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      description: 라벨 색상 (hex)
      example: "#FF0000"
    boardId:
      type: string
      format: uuid
      description: 소속 보드 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"

Invitation:
  type: object
  required:
    - id
    - email
    - boardId
    - role
    - status
    - expiresAt
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: 초대 고유 식별자
      example: "123e4567-e89b-12d3-a456-426614174000"
    email:
      type: string
      format: email
      description: 초대받을 이메일
      example: "guest@example.com"
    boardId:
      type: string
      format: uuid
      description: 초대할 보드 ID
      example: "123e4567-e89b-12d3-a456-426614174000"
    role:
      type: string
      enum: [MEMBER, VIEWER]
      description: 초대할 역할
      example: "MEMBER"
    status:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED]
      description: 초대 상태
      example: "PENDING"
    expiresAt:
      type: string
      format: date-time
      description: 만료일시
      example: "2024-01-08T00:00:00Z"
    createdAt:
      type: string
      format: date-time
      description: 생성일시
      example: "2024-01-01T00:00:00Z"
