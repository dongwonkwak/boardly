# 공통 파라미터 정의

workspaceId:
  name: workspaceId
  in: path
  required: true
  description: 워크스페이스 ID
  schema:
    type: string
    format: uuid
  example: "wks_1234567890abcdef"

boardId:
  name: boardId
  in: path
  required: true
  description: 보드 ID
  schema:
    type: string
    format: uuid
  example: "brd_1234567890abcdef"

cardId:
  name: cardId
  in: path
  required: true
  description: 카드 ID
  schema:
    type: string
    format: uuid
  example: "crd_1234567890abcdef"

listId:
  name: listId
  in: path
  required: true
  description: 리스트 ID
  schema:
    type: string
    format: uuid
  example: "lst_1234567890abcdef"

commentId:
  name: commentId
  in: path
  required: true
  description: 댓글 ID
  schema:
    type: string
    format: uuid
  example: "cmt_1234567890abcdef"

labelId:
  name: labelId
  in: path
  required: true
  description: 라벨 ID
  schema:
    type: string
    format: uuid
  example: "lbl_1234567890abcdef"

invitationId:
  name: invitationId
  in: path
  required: true
  description: 초대 ID
  schema:
    type: string
    format: uuid
  example: "inv_1234567890abcdef"

attachmentId:
  name: attachmentId
  in: path
  required: true
  description: 첨부파일 ID
  schema:
    type: string
    format: uuid
  example: "att_1234567890abcdef"

userId:
  name: userId
  in: path
  required: true
  description: 사용자 ID
  schema:
    type: string
    format: uuid
  example: "usr_1234567890abcdef"

page:
  name: page
  in: query
  required: false
  description: 페이지 번호 (기본값: 1)
  schema:
    type: integer
    minimum: 1
    default: 1
  example: 1

limit:
  name: limit
  in: query
  required: false
  description: 페이지당 항목 수 (기본값: 20, 최대: 100)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  example: 20

search:
  name: search
  in: query
  required: false
  description: 검색어
  schema:
    type: string
    minLength: 1
  example: "프로젝트"

sortBy:
  name: sortBy
  in: query
  required: false
  description: 정렬 기준
  schema:
    type: string
    enum:
      - createdAt
      - updatedAt
      - name
      - title
    default: createdAt
  example: "createdAt"

sortOrder:
  name: sortOrder
  in: query
  required: false
  description: 정렬 순서
  schema:
    type: string
    enum: 
      - asc
      - desc
    default: desc
  example: "desc"
